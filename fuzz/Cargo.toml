[package]
name = "cartridge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
cartridge-core = { path = "../crates/cartridge-core" }
cartridge-desktop = { path = "../crates/cartridge-desktop" }
cartridge-media = { path = "../crates/cartridge-media" }
cartridge-network = { path = "../crates/cartridge-network" }
cartridge-release = { path = "../crates/cartridge-release" }
cartridge-storage = { path = "../crates/cartridge-storage" }
cartridge-trace = { path = "../crates/cartridge-trace" }
libfuzzer-sys = "0.4.10"
serde_json = "1.0.145"
tempfile = "3.27.0"
toml = "1.0.3"
wit-parser = "0.252.0"

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
