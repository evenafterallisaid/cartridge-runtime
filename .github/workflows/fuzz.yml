name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz run archive -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly fuzz run manifest -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly fuzz run snapshot -- -max_total_time=30 -rss_limit_mb=2048
      - run: cargo +nightly fuzz run trace -- -max_total_time=30 -rss_limit_mb=2048
