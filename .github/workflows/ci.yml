name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cartridge-desktop/package-lock.json

      - name: Build desktop frontend
        working-directory: apps/cartridge-desktop
        run: npm ci && npm audit --audit-level=low && npm run build

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Check native desktop shell
        run: |
          cargo fmt --manifest-path apps/cartridge-desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/cartridge-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test host
        run: cargo test --workspace

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          cargo audit --file apps/cartridge-desktop/src-tauri/Cargo.lock

      - name: Build example component
        run: cargo build --manifest-path examples/hello-cartridge/Cargo.toml --target wasm32-wasip2 --release

      - name: Run developer workflow scaffold
        shell: bash
        run: |
          cargo run -p cartridge-cli -- new "$RUNNER_TEMP/cartridge-sdk-smoke" --language rust
          cargo run -p cartridge-cli -- check "$RUNNER_TEMP/cartridge-sdk-smoke"
          cargo run -p cartridge-cli -- schema --output "$RUNNER_TEMP/Cartridge.schema.json"
          cargo run -p cartridge-cli -- dev "$RUNNER_TEMP/cartridge-sdk-smoke" --once

      - name: Build media reference components
        shell: bash
        run: |
          cargo build --manifest-path examples/visual-cartridge/Cargo.toml --target wasm32-wasip2 --release
          cargo build --manifest-path examples/synth-cartridge/Cargo.toml --target wasm32-wasip2 --release
          cargo build --manifest-path examples/effect-cartridge/Cargo.toml --target wasm32-wasip2 --release

      - name: Build timeout regression component
        run: cargo build --manifest-path tests/fixtures/timeout-cartridge/Cargo.toml --target wasm32-wasip2 --release

      - name: Build migration regression component
        run: cargo build --manifest-path tests/fixtures/migration-cartridge/Cargo.toml --target wasm32-wasip2 --release

      - name: Run end-to-end example
        shell: bash
        run: |
          cargo run -p cartridge-cli -- pack examples/hello-cartridge/Cartridge.toml --component examples/hello-cartridge/target/wasm32-wasip2/release/hello_cartridge.wasm --assets examples/hello-cartridge/assets --output hello.cartridge
          cargo run -p cartridge-cli -- inspect hello.cartridge
          cargo run -p cartridge-cli -- verify hello.cartridge
          cargo run -p cartridge-cli -- platform hello.cartridge --json
          cargo run -p cartridge-cli -- identity keygen --output developer.key.json
          cargo run -p cartridge-cli -- identity sign hello.cartridge --key developer.key.json --output hello.signature.json
          cargo run -p cartridge-cli -- identity trust hello.signature.json --store trust.json --label "ci developer"
          cargo run -p cartridge-cli -- identity verify hello.cartridge hello.signature.json --trust trust.json
          binary=target/debug/cartridge
          if [ -x target/debug/cartridge.exe ]; then binary=target/debug/cartridge.exe; fi
          set +e
          "$binary" run hello.cartridge --state-dir unauthenticated-state
          unauthenticated_state_status=$?
          set -e
          if [ "$unauthenticated_state_status" -eq 0 ] || [ -e unauthenticated-state ]; then
            echo "unsigned package opened durable state"
            exit 1
          fi
          cargo run -p cartridge-cli -- release create "$binary" --target ci-host --version 1.0.0 --key developer.key.json --output runtime-1.0.0.json
          cargo run -p cartridge-cli -- release verify runtime-1.0.0.json --trust trust.json
          cargo run -p cartridge-cli -- release install runtime-1.0.0.json "$binary" --target ci-host --trust trust.json --root runtime-install
          cargo run -p cartridge-cli -- release create "$binary" --target ci-host --version 1.1.0 --key developer.key.json --output runtime-1.1.0.json
          cargo run -p cartridge-cli -- release install runtime-1.1.0.json "$binary" --target ci-host --trust trust.json --root runtime-install
          cargo run -p cartridge-cli -- release status --root runtime-install --json | grep '"version": "1.1.0"'
          cargo run -p cartridge-cli -- release rollback --root runtime-install
          cargo run -p cartridge-cli -- release status --root runtime-install --json | grep '"version": "1.0.0"'
          cargo run -p cartridge-cli -- stability benchmark hello.cartridge --iterations 2 --output benchmark.json -- CI
          cargo run -p cartridge-cli -- stability soak hello.cartridge --iterations 5 --output soak.json -- CI
          grep '"local_only": true' benchmark.json soak.json
          cargo run -p cartridge-cli -- registry init registry
          cargo run -p cartridge-cli -- registry publish hello.cartridge hello.signature.json --trust trust.json --root registry
          cargo run -p cartridge-cli -- registry resolve dev.cartridge.hello "^0.1" --root registry
          cargo run -p cartridge-cli -- registry audit --root registry --trust trust.json
          cargo run -p cartridge-cli -- asset verify hello.cartridge message.txt
          cargo run -p cartridge-cli -- deps hello.cartridge
          cargo run -p cartridge-cli -- resolve hello.cartridge
          cargo run -p cartridge-cli -- resolve hello.cartridge --lock hello.cartridge-lock.json
          cargo run -p cartridge-cli -- resolve hello.cartridge --locked hello.cartridge-lock.json
          cp hello.cartridge changed.cartridge
          printf ' ' >> changed.cartridge
          set +e
          "$binary" resolve changed.cartridge --locked hello.cartridge-lock.json
          changed_lock_status=$?
          set -e
          if [ "$changed_lock_status" -eq 0 ]; then
            echo "composition lock accepted changed package bytes"
            exit 1
          fi
          cargo run -p cartridge-cli -- run hello.cartridge --trace hello.trace.json -- CI
          cargo run -p cartridge-cli -- --storage-signature hello.signature.json --storage-trust trust.json run hello.cartridge --state-dir state -- First
          cargo run -p cartridge-cli -- --storage-signature hello.signature.json --storage-trust trust.json storage export hello.cartridge --state-dir state --output first.cartridge-state.json
          cargo run -p cartridge-cli -- --storage-signature hello.signature.json --storage-trust trust.json run hello.cartridge --state-dir state -- Second
          cargo run -p cartridge-cli -- --storage-signature hello.signature.json --storage-trust trust.json storage export hello.cartridge --state-dir state --output second.cartridge-state.json
          cargo run -p cartridge-cli -- --storage-signature hello.signature.json --storage-trust trust.json storage status hello.cartridge --state-dir state
          cargo run -p cartridge-cli -- storage inspect first.cartridge-state.json
          cargo run -p cartridge-cli -- storage migration-plan hello.cartridge --from-schema 0
          cargo run -p cartridge-cli -- storage diff first.cartridge-state.json second.cartridge-state.json
          cargo run -p cartridge-cli -- run hello.cartridge --from-snapshot first.cartridge-state.json --snapshot-output branch.cartridge-state.json -- Branch
          cargo run -p cartridge-cli -- storage diff first.cartridge-state.json branch.cartridge-state.json
          cargo run -p cartridge-cli -- run hello.cartridge --trace capsule.trace.json --from-snapshot first.cartridge-state.json --snapshot-output capsule-result.cartridge-state.json -- Capsule
          cargo run -p cartridge-cli -- capsule create hello.cartridge --source first.cartridge-state.json --trace capsule.trace.json --result capsule-result.cartridge-state.json --output run.cartridge-capsule.json
          cargo run -p cartridge-cli -- capsule inspect run.cartridge-capsule.json
          cargo run -p cartridge-cli -- capsule verify run.cartridge-capsule.json
          cargo run -p cartridge-cli -- capsule diff run.cartridge-capsule.json run.cartridge-capsule.json
          cargo run -p cartridge-cli -- capsule replay run.cartridge-capsule.json
          cargo run -p cartridge-cli -- --storage-signature hello.signature.json --storage-trust trust.json storage restore hello.cartridge first.cartridge-state.json --state-dir state --dry-run
          cargo run -p cartridge-cli -- --storage-signature hello.signature.json --storage-trust trust.json storage restore hello.cartridge first.cartridge-state.json --state-dir state
          cargo run -p cartridge-cli -- --storage-signature hello.signature.json --storage-trust trust.json storage export hello.cartridge --state-dir state --output restored.cartridge-state.json
          cargo run -p cartridge-cli -- storage diff first.cartridge-state.json restored.cartridge-state.json
          cargo run -p cartridge-cli -- trace inspect hello.trace.json
          cargo run -p cartridge-cli -- trace diff hello.trace.json hello.trace.json
          cargo run -p cartridge-cli -- trace redact hello.trace.json --output hello.trace-summary.json
          cargo run -p cartridge-cli -- trace export hello.trace.json --output hello.timeline.json
          cargo run -p cartridge-cli -- conformance hello.cartridge -- CI
          cargo run -p cartridge-cli -- library install hello.cartridge --root library
          cargo run -p cartridge-cli -- stack validate tests/fixtures/Cartridge.stack.toml
          cargo run -p cartridge-cli -- stack plan tests/fixtures/Cartridge.stack.toml --library library --output hello.stack-plan.json
          grep '"timeout_ms": 5000' hello.stack-plan.json
          cargo run -p cartridge-cli -- stack apply tests/fixtures/Cartridge.stack.toml --library library --root engine
          cargo run -p cartridge-cli -- stack apply tests/fixtures/Cartridge.stack.toml --library library --root engine
          cargo run -p cartridge-cli -- stack list --root engine
          cargo run -p cartridge-cli -- stack status hello-stack --root engine
          cargo run -p cartridge-cli -- stack supervise hello-stack --library library --root engine
          cargo run -p cartridge-cli -- stack ps hello-stack --root engine
          cargo run -p cartridge-cli -- stack events hello-stack --root engine
          cargo run -p cartridge-cli -- stack stop hello-stack --root engine
          cargo run -p cartridge-cli -- stack remove hello-stack --root engine
          cargo run -p cartridge-cli -- stack status hello-stack --root engine
          cargo run -p cartridge-cli -- stack apply tests/fixtures/Cartridge.limits.stack.toml --library library --root engine
          cargo run -p cartridge-cli -- stack supervise hello-budget-stack --library library --root engine --json
          cargo run -p cartridge-cli -- stack ps hello-budget-stack --root engine --json | grep '"phase": "failed"'
          cargo run -p cartridge-cli -- stack remove hello-budget-stack --root engine
          "$binary" engine serve --root daemon-engine --library library --max-supervisors 2 --workers-per-stack 4 --json > daemon-engine.out 2> daemon-engine.err &
          daemon_pid=$!
          for attempt in {1..100}; do
            if [ -e daemon-engine/daemon.json ]; then break; fi
            if ! kill -0 "$daemon_pid" 2>/dev/null; then
              cat daemon-engine.err
              exit 1
            fi
            sleep 0.05
          done
          test -e daemon-engine/daemon.json
          "$binary" engine ping --root daemon-engine --json | grep '"reachable":true'
          "$binary" engine update tests/fixtures/Cartridge.stack.toml --root daemon-engine --timeout-ms 15000 --json | grep '"phase": "committed"'
          "$binary" engine rollout status hello-stack --root daemon-engine --json | grep '"health_report_sha256"'
          "$binary" engine wait hello-stack --root daemon-engine --timeout-ms 15000 --json | grep -E '"state": "(healthy|completed)"'
          "$binary" engine health hello-stack --root daemon-engine --json | grep '"report_sha256"'
          "$binary" engine ps hello-stack --root daemon-engine --json | grep -E '"phase": "(running|succeeded)"'
          "$binary" engine events hello-stack --root daemon-engine --tail 1 --json | grep '"revision": 1'
          "$binary" engine stop hello-stack --root daemon-engine
          "$binary" engine remove hello-stack --root daemon-engine
          set +e
          failed_update=$("$binary" engine update tests/fixtures/Cartridge.limits.stack.toml --root daemon-engine --timeout-ms 15000 2>&1)
          failed_update_status=$?
          set -e
          if [ "$failed_update_status" -eq 0 ]; then
            echo "resource-exhausted rollout unexpectedly committed"
            exit 1
          fi
          printf '%s' "$failed_update" | grep 'rollout failed and was RolledBack'
          "$binary" engine status hello-budget-stack --root daemon-engine --json | grep '"state": "removed"'
          "$binary" engine rollout status hello-budget-stack --root daemon-engine --json | grep '"phase": "rolled-back"'
          "$binary" engine shutdown --root daemon-engine --json | grep '"stopping":true'
          wait "$daemon_pid"
          test ! -e daemon-engine/daemon.json
          if grep -q 'key_hex' daemon-engine.out; then
            echo "daemon exposed its control key"
            exit 1
          fi
          cargo run -p cartridge-cli -- pack tests/fixtures/composition-root.Cartridge.toml --component examples/hello-cartridge/target/wasm32-wasip2/release/hello_cartridge.wasm --output composition-root.cartridge
          cargo run -p cartridge-cli -- pack tests/fixtures/composition-provider.Cartridge.toml --component examples/hello-cartridge/target/wasm32-wasip2/release/hello_cartridge.wasm --output composition-provider.cartridge
          cargo run -p cartridge-cli -- library install composition-root.cartridge --root library
          cargo run -p cartridge-cli -- library install composition-provider.cartridge --root library
          cargo run -p cartridge-cli -- library resolve dev.cartridge.composition-root --root library --lock composition.cartridge-lock.json
          cargo run -p cartridge-cli -- library resolve dev.cartridge.composition-root --root library --locked composition.cartridge-lock.json
          cargo run -p cartridge-cli -- library preflight dev.cartridge.hello --root library
          cargo run -p cartridge-cli -- library grant dev.cartridge.hello clock assets storage --root library
          cargo run -p cartridge-cli -- library run dev.cartridge.hello --root library -- CI
          blob_json=$(cargo run -q -p cartridge-cli -- blob put hello.trace.json --store blobs --json)
          blob_digest=$(printf '%s' "$blob_json" | grep '"sha256"' | head -1 | cut -d '"' -f4)
          cargo run -p cartridge-cli -- blob verify "$blob_digest" --store blobs
          cargo run -p cartridge-cli -- blob get "$blob_digest" --store blobs --output restored.trace.json
          cmp hello.trace.json restored.trace.json
          cargo run -p cartridge-cli -- blob list --store blobs
          cargo run -p cartridge-cli -- blob audit --store blobs
          cargo run -p cartridge-cli -- blob roots create --snapshot first.cartridge-state.json --capsule run.cartridge-capsule.json --output roots.cartridge-blobs.json
          cargo run -p cartridge-cli -- blob roots inspect roots.cartridge-blobs.json
          cargo run -p cartridge-cli -- blob roots verify roots.cartridge-blobs.json --store blobs
          cargo run -p cartridge-cli -- blob gc --store blobs --manifest roots.cartridge-blobs.json --keep "$blob_digest"
          cargo run -p cartridge-cli -- blob gc --store blobs --keep "$blob_digest"
          cargo run -p cartridge-cli -- replay hello.cartridge hello.trace.json -- CI
          cargo run -p cartridge-cli -- pack examples/visual-cartridge/Cartridge.toml --component examples/visual-cartridge/target/wasm32-wasip2/release/visual_cartridge.wasm --output visual.cartridge
          cargo run -p cartridge-cli -- run visual.cartridge --trace visual.trace.json --media-dir visual-media --input examples/visual-cartridge/input.json
          cargo run -p cartridge-cli -- replay visual.cartridge visual.trace.json --media-dir visual-replay
          cmp visual-media/frame-0000-window-1.png visual-replay/frame-0000-window-1.png
          cargo run -p cartridge-cli -- trace diff visual.trace.json visual.trace.json
          cargo run -p cartridge-cli -- pack examples/synth-cartridge/Cartridge.toml --component examples/synth-cartridge/target/wasm32-wasip2/release/synth_cartridge.wasm --output synth.cartridge
          cargo run -p cartridge-cli -- run synth.cartridge --trace synth.trace.json --media-dir synth-media --midi examples/synth-cartridge/midi.json
          cargo run -p cartridge-cli -- replay synth.cartridge synth.trace.json --media-dir synth-replay
          cmp synth-media/audio-0000.wav synth-replay/audio-0000.wav
          cargo run -p cartridge-cli -- pack examples/effect-cartridge/Cartridge.toml --component examples/effect-cartridge/target/wasm32-wasip2/release/effect_cartridge.wasm --output effect.cartridge
          cargo run -p cartridge-cli -- run effect.cartridge --media-dir effect-media
          cargo run -p cartridge-cli -- pack tests/fixtures/migration-cartridge/Cartridge.toml --component tests/fixtures/migration-cartridge/target/wasm32-wasip2/release/migration_cartridge.wasm --output migration.cartridge
          cargo run -p cartridge-cli -- pack tests/fixtures/migration-cartridge/legacy.Cartridge.toml --component tests/fixtures/migration-cartridge/target/wasm32-wasip2/release/migration_cartridge.wasm --output legacy-migration.cartridge
          cargo run -p cartridge-cli -- identity sign migration.cartridge --key developer.key.json --output migration.signature.json
          cargo run -p cartridge-cli -- identity sign legacy-migration.cartridge --key developer.key.json --output legacy-migration.signature.json
          cargo run -p cartridge-cli -- storage migrate migration.cartridge tests/fixtures/migration-cartridge/source.cartridge-state.json --output migrated.cartridge-state.json
          cargo run -p cartridge-cli -- storage inspect migrated.cartridge-state.json
          cargo run -p cartridge-cli -- run migration.cartridge --from-snapshot migrated.cartridge-state.json
          cargo run -p cartridge-cli -- --storage-signature legacy-migration.signature.json --storage-trust trust.json storage restore legacy-migration.cartridge tests/fixtures/migration-cartridge/source.cartridge-state.json --state-dir migration-state
          cargo run -p cartridge-cli -- --storage-signature legacy-migration.signature.json --storage-trust trust.json storage restore legacy-migration.cartridge tests/fixtures/migration-cartridge/source.cartridge-state.json --state-dir uncommitted-migration-state
          cargo run -p cartridge-cli -- --storage-signature migration.signature.json --storage-trust trust.json storage migrate-commit migration.cartridge --state-dir migration-state --rollback-output rollback.cartridge-state.json --receipt-output migration-receipt.json
          cargo run -p cartridge-cli -- storage inspect rollback.cartridge-state.json
          cargo run -p cartridge-cli -- storage migration-receipt migration-receipt.json
          cargo run -p cartridge-cli -- --storage-signature migration.signature.json --storage-trust trust.json storage migration-recover migration.cartridge migration-receipt.json --state-dir migration-state --json | grep '"status": "committed"'
          cargo run -p cartridge-cli -- --storage-signature migration.signature.json --storage-trust trust.json storage migration-recover migration.cartridge migration-receipt.json --state-dir uncommitted-migration-state --json | grep '"status": "not_committed"'
          cargo run -p cartridge-cli -- --storage-signature migration.signature.json --storage-trust trust.json run migration.cartridge --state-dir migration-state
          cargo run -p cartridge-cli -- pack tests/fixtures/migration-cartridge/missing-export.Cartridge.toml --component examples/hello-cartridge/target/wasm32-wasip2/release/hello_cartridge.wasm --output missing-migration-export.cartridge
          cargo run -p cartridge-cli -- pack tests/fixtures/timeout-cartridge/Cartridge.toml --component tests/fixtures/timeout-cartridge/target/wasm32-wasip2/release/timeout_cartridge.wasm --output timeout.cartridge
          printf ' ' >> capsule-result.cartridge-state.json
          set +e
          "$binary" capsule verify run.cartridge-capsule.json
          tampered_capsule_status=$?
          set -e
          if [ "$tampered_capsule_status" -eq 0 ]; then
            echo "capsule verification accepted a changed result artifact"
            exit 1
          fi
          set +e
          "$binary" __worker-run hello.cartridge
          direct_worker_status=$?
          set -e
          if [ "$direct_worker_status" -eq 0 ]; then
            echo "internal worker command bypassed its context guard"
            exit 1
          fi
          set +e
          "$binary" storage migrate migration.cartridge tests/fixtures/migration-cartridge/failing.cartridge-state.json --output failed-migration.cartridge-state.json
          migration_status=$?
          set -e
          if [ "$migration_status" -eq 0 ] || [ -e failed-migration.cartridge-state.json ]; then
            echo "failed migration produced an output snapshot"
            exit 1
          fi
          cargo run -p cartridge-cli -- --storage-signature legacy-migration.signature.json --storage-trust trust.json storage restore legacy-migration.cartridge tests/fixtures/migration-cartridge/failing.cartridge-state.json --state-dir failed-migration-state
          set +e
          "$binary" --storage-signature migration.signature.json --storage-trust trust.json storage migrate-commit migration.cartridge --state-dir failed-migration-state --rollback-output failed-rollback.cartridge-state.json --receipt-output failed-migration-receipt.json
          migration_commit_status=$?
          set -e
          if [ "$migration_commit_status" -eq 0 ] || [ ! -e failed-rollback.cartridge-state.json ] || [ -e failed-migration-receipt.json ]; then
            echo "failed durable migration produced incorrect recovery artifacts"
            exit 1
          fi
          "$binary" --storage-signature legacy-migration.signature.json --storage-trust trust.json storage status legacy-migration.cartridge --state-dir failed-migration-state --json | grep '"state_schema": 0'
          set +e
          "$binary" storage migrate missing-migration-export.cartridge tests/fixtures/migration-cartridge/source.cartridge-state.json --output missing-export.cartridge-state.json
          missing_export_status=$?
          set -e
          if [ "$missing_export_status" -eq 0 ] || [ -e missing-export.cartridge-state.json ]; then
            echo "component without migrate export produced an output snapshot"
            exit 1
          fi
          set +e
          "$binary" run timeout.cartridge &
          runtime_pid=$!
          for attempt in {1..30}; do
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              wait "$runtime_pid"
              runtime_status=$?
              set -e
              if [ "$runtime_status" -eq 0 ]; then
                echo "timeout fixture unexpectedly completed"
                exit 1
              fi
              exit 0
            fi
            sleep 0.1
          done
          kill "$runtime_pid" 2>/dev/null
          wait "$runtime_pid" 2>/dev/null
          echo "timeout fixture escaped the runtime deadline"
          exit 1
