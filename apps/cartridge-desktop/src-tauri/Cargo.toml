[package]
name = "cartridge-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[lib]
name = "cartridge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cartridge-desktop = { path = "../../../crates/cartridge-desktop" }
cartridge-engine = { path = "../../../crates/cartridge-engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = [] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
