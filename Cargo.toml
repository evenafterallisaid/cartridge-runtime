[workspace]
members = [
    "crates/cartridge-identity",
    "crates/cartridge-network",
    "crates/cartridge-release",
    "crates/cartridge-dev",
    "crates/cartridge-desktop",
    "crates/cartridge-engine",
    "crates/cartridge-media",
    "crates/cartridge-cli",
    "crates/cartridge-core",
    "crates/cartridge-runtime",
    "crates/cartridge-storage",
    "crates/cartridge-trace",
]
exclude = ["examples/hello-cartridge", "apps/cartridge-desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
rand = "0.10.2"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
png = "0.18.0"
tokio = { version = "1.47.1", features = ["time"] }
toml = "1.0.3"
walkdir = "2.5.0"
wasmtime = { version = "47.0.3", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "47.0.3", default-features = false, features = ["p2"] }
wasmtime-wasi-io = "47.0.3"
wat = "1.252.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
chacha20poly1305 = "0.11.0"
command-group = "=5.0.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
ed25519-dalek = "3.0.0"
url = { version = "2.5.8", features = ["serde"] }
x25519-dalek = "3.0.0"
zeroize = "1.8.2"
windows-spawn = "=0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
