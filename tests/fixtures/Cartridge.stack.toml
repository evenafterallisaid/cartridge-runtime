format_version = 1
name = "hello-stack"

[security]
profile = "strict"
sandbox = "required"

[[instances]]
name = "hello"
cartridge = "dev.cartridge.hello"
version = "^0.1"
replicas = 1
restart = "on-failure"
max_restarts = 3
allow = ["clock", "assets", "storage"]
args = ["Stack"]

[[resources]]
name = "hello-state"
kind = "state"
owner = "hello"
retention = "retain"
quota_bytes = 1048576
