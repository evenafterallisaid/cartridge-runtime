format_version = 1
name = "hello-stack"

[security]
profile = "strict"
sandbox = "required"

[[instances]]
name = "hello"
cartridge = "dev.cartridge.hello"
version = "^0.1"
replicas = 1
restart = "on-failure"
max_restarts = 3
allow = ["clock", "assets", "storage"]
args = ["Stack"]

[instances.health]
startup_timeout_ms = 5000
readiness_timeout_ms = 10000
liveness_timeout_ms = 1000
failure_threshold = 2

[instances.limits]
fuel = 5000000
memory_bytes = 33554432
timeout_ms = 5000
storage_bytes = 524288
storage_keys = 512
storage_value_bytes = 131072

[[resources]]
name = "hello-state"
kind = "state"
owner = "hello"
retention = "retain"
quota_bytes = 1048576
